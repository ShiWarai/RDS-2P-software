# Конфигурация двигателей квадропеда RDS-2P
motor_types:
  SCS40:
    # Максимальные значения для units
    min_position_units: 0         # Положение от 0 до 1023
    max_position_units: 1023      # Положение от 0 до 1023
    min_velocity_units: 0         # Скорость от 0 до 1023
    max_velocity_units: 1023      # Скорость от 0 до 1023  
    min_acceleration_units: 0     # Ускорение от 0 до 255
    max_acceleration_units: 255   # Ускорение от 0 до 255
    
    # Коэффициенты конвертации
    motor_units_per_radian: 195.56959      # 1023 units / 1.67 rad ≈ 614.4
    motor_units_per_rad_per_sec: 195.56959 # 1023 units / 1.0 rad/s
    motor_units_per_rad_per_sec_sq: 195.56959 # 255 units / 2.55 rad/s²
    
    # Коэффициент напряжения (реальный вольтаж = units * voltage_scale)
    voltage_scale: 0.1
    
    # Коэффициент тока (реальный ток = units * current_scale)
    current_scale: 0.0065
    
    # Коэффициент усилия (реальное усилие = current_units * effort_scale)
    effort_scale: 0.01
    
    # Максимальные физические значения
    max_velocity: 8.7       # рад/с
    max_acceleration: 20.0  # рад/с²
    
    # PID коэффициенты для симуляции
    pid_kp: 6.4            # Пропорциональный коэффициент
    pid_ki: 0.0             # Интегральный коэффициент
    pid_kd: 6.0             # Дифференциальный коэффициент

