# Источники команд скорости для cmd_vel_mux.
#
# source_names, source_topics, source_timeouts и source_priorities должны
# быть одинаковой длины. Больший priority побеждает, когда несколько
# источников одновременно публикуют ненулевую Twist.
#
# timeout_sec — сколько секунд источник считается свежим после последнего
# сообщения. Для потоковых источников (джойстик, клавиатура) это 0.5 с;
# для одноразовых голосовых команд — с запасом на длительность шага.
#
# Для нового устройства ввода достаточно добавить запись во все четыре
# списка, например:
#   source_names:      [joy, keyboard, voice, gamepad2]
#   source_topics:     [/cmd_vel/joy, /cmd_vel/keyboard, /cmd_vel/voice, /cmd_vel/gamepad2]
#   source_timeouts:   [0.5, 0.5, 2.5, 0.5]
#   source_priorities: [100, 90, 50, 80]

cmd_vel_mux:
  ros__parameters:
    output_topic: /cmd_vel
    active_topic: /cmd_vel_mux/active
    state_topic: /cmd_vel_mux/state
    publish_rate: 20.0
    state_rate: 2.0
    zero_epsilon: 1.0e-6

    source_names:
      - joy
      - keyboard
      - voice
      - ball_follow
    source_topics:
      - /cmd_vel/joy
      - /cmd_vel/keyboard
      - /cmd_vel/voice
      - /cmd_vel/ball_follow
    source_timeouts:
      - 0.5
      - 0.5
      - 2.5
      - 0.5
    source_priorities:
      - 100
      - 90
      - 50
      - 40
