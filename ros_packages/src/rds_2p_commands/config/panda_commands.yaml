# Компактный пресет «Команды Панды»: только реально исполняемые routine_id
# из config/commands.yaml (dispatch в RobotRoutineHandler).
# Классификация — system_one_ros/srv/Ask (нативный Kev/NPU), без regex.
# kind: start -> question(choice) -> options[].then:
#   kind: command — routine_id для /robot/panda_command
#   kind: wait    — пауза ms
#   kind: say     — фраза в /audio/output/speak

kind: start
then:
  - kind: question
    id: q_commands
    qtype: choice
    name: Команды
    instructions: Какая команда подходит к фразе?
    options:
      - id: give_paw
        name: Дай лапу
        examples: ["дай лапу", "лапу", "поздоровайся", "дай пять"]
        then:
          - {kind: command, command: give_paw, label: "дай лапу"}
      - id: stand_at_attention
        name: Равняйся
        examples: ["равняйся", "стой ровно"]
        then:
          - {kind: command, command: stand_at_attention, label: "равняйся"}
      # Отдельная метка «Встать»: иначе Kev путает «вставай» с «Не команда».
      - id: stand_up
        name: Встать
        examples: ["вставай", "встань", "встать", "марш"]
        then:
          - {kind: command, command: dismiss, label: "встать"}
      - id: dismiss
        name: Отставить
        examples: ["отставить", "свободен"]
        then:
          - {kind: command, command: dismiss, label: "отставить"}
      - id: lie_down
        name: Лежать
        examples: ["лежать", "ложись", "ляг"]
        then:
          - {kind: command, command: lie_down, label: "лежать"}
      - id: rotate
        name: Кувырок
        examples: ["кувырок", "перевернись", "сальто", "вращайся"]
        then:
          - {kind: command, command: rotate, label: "кувырок"}
      - id: pray
        name: Служить
        examples: ["служить", "служи"]
        then:
          - {kind: command, command: pray, label: "служить"}
      - id: reconnect_joystick
        name: Джойстик
        examples: ["держи джойстик", "возьми джойстик", "подключись к джойстику"]
        then:
          - {kind: command, command: reconnect_joystick, label: "джойстик"}
      # Не действие: классификатор всегда выбирает один из вариантов,
      # поэтому «ничего не делать» — это отдельная метка с пустой веткой.
      - id: no_command
        name: Не команда
        examples: ["не является командой робота или призывом к физическому действию: вопрос, беседа, приветствие, отрицание, сомнение"]
        then: []