# Конфигурация свойств классов команд
#
# Определяет свойства классов команд (приоритет, таймаут, поведение при конфликте).
# Сам класс команды определяется в command_mappings.yaml!

classes:
  # Класс "motors" - команды управления моторами
  motors:
    priority: 10  # Приоритет (чем выше, тем важнее)
    cancel_timeout: 0.5  # Таймаут отмены предыдущей команды (секунды)
    conflict_behavior: "cancel_previous"  # Поведение при конфликте: "cancel_previous", "reject", "queue"
  
  # Класс "audio_output" - команды на динамик
  audio_output:
    priority: 5
    cancel_timeout: 0.2
    conflict_behavior: "cancel_previous"
  
  # Класс "audio_input" - команды записи звука
  audio_input:
    priority: 3
    cancel_timeout: 1.0
    conflict_behavior: "reject"  # Не отменяем запись, просто отклоняем новую
  
  # Класс "camera" - команды работы с камерой
  camera:
    priority: 2
    cancel_timeout: 0.5
    conflict_behavior: "reject"
  
  # Класс "sensors" - команды работы с сенсорами
  sensors:
    priority: 1
    cancel_timeout: 0.0
    conflict_behavior: "queue"  # Можно ставить в очередь
  
  # Класс по умолчанию
  default:
    priority: 0
    cancel_timeout: 0.0
    conflict_behavior: "reject"
