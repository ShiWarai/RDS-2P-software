# Источники команд скорости для cmd_vel_mux.
#
# Мультиплексор публикует в /cmd_vel команды только выбранного источника.
# Текущий источник задаётся именем через топик /cmd_vel_mux/select
# (std_msgs/String): "joy", "keyboard", "voice", "ball_follow" или
# пустая строка/"none"
# для остановки.
#
# source_names, source_topics и source_timeouts должны быть одинаковой длины.
# timeout_sec — сколько секунд источник считается свежим после последнего
# сообщения. Если выбранный источник молчит дольше таймаута, публикуется
# нулевая Twist, а /cmd_vel_mux/active = false.
#
# default_source — источник, выбираемый при старте узла (пусто — ничего не
# выбрано). Для нового устройства ввода достаточно добавить запись во все
# три списка, например:
#   source_names:    [joy, keyboard, voice, gamepad2]
#   source_topics:   [/cmd_vel/joy, /cmd_vel/keyboard, /cmd_vel/voice, /cmd_vel/gamepad2]
#   source_timeouts: [0.5, 0.5, 2.5, 0.5]

cmd_vel_mux:
  ros__parameters:
    output_topic: /cmd_vel
    active_topic: /cmd_vel_mux/active
    state_topic: /cmd_vel_mux/state
    select_topic: /cmd_vel_mux/select
    default_source: joy
    publish_rate: 20.0
    state_rate: 2.0
    zero_epsilon: 1.0e-6

    source_names:
      - joy
      - keyboard
      - voice
      - ball_follow
    source_topics:
      - /cmd_vel/joy
      - /cmd_vel/keyboard
      - /cmd_vel/voice
      - /cmd_vel/ball_follow
    source_timeouts:
      - 0.5
      - 0.5
      - 2.5
      - 0.5