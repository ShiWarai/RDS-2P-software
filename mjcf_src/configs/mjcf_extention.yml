# Конфигурация для постобработки MJCF файла

# Универсальная конфигурация для элементов верхнего уровня MJCF
# Каждый элемент может содержать произвольные атрибуты
# Существующие атрибуты будут переопределены, новые - добавлены
global_mjcf:
  mujoco:
    model: "rds-2p"  # Название модели робота
  apply_joint_limits: true  # Применять ли ограничения суставов
  hip_and_base_contact: true  # Включить ли контакт между бедром и базой

base_link_position:
  pos: [0.0, 0.0, 0.16]  # Позиция базового звена

# Из-за неправильной работы плагина - пропускается инерция у base_link
base_link_body:
  inertial:
    pos: [-0.007317, -0.000191, -0.004098]  # Позиция инерции
    mass: 1.522000  # Масса базового звена
    fullinertia: [0.002168, 0.014482, 0.015817, 0.000055, -0.000034, -0.000006]  # Полные инерционные параметры

# Полные инерционные параметры для всех тел
# Формат: имя_тела: {pos: [x, y, z], mass: m, diaginertia: [ixx, iyy, izz], quat: [w, x, y, z]}
body_inertials:
  # Leg block links
  "leg_block_bl_link":
    pos: [0.003043, -0.010057, 0.002359]  # Позиция инерции
    mass: 0.193  # Масса
    diaginertia: [9.51515e-05, 7.04616e-05, 6.13868e-05]  # Диагональная инерция
    quat: [0, 0, 0, 1]  # Кватернион
  "leg_block_br_link":
