# Конфигурация сенсоров и сайтов
sensors:
  base_sensors:
    - name: "base_link_site_upvector"  # Имя сенсора для вектора вверх
      type: "framezaxis"  # Тип сенсора
      objtype: "site"  # Тип объекта, к которому привязан сенсор
      objname: "base_link_site"  # Имя объекта, к которому привязан сенсор
    - name: "base_link_site_forwardvector"  # Имя сенсора для вектора вперед
      type: "framexaxis"  # Тип сенсора
      objtype: "site"  # Тип объекта, к которому привязан сенсор
      objname: "base_link_site"  # Имя объекта, к которому привязан сенсор
    - name: "base_link_site_global_linvel"  # Имя сенсора для глобальной линейной скорости
      type: "framelinvel"  # Тип сенсора
      objtype: "site"  # Тип объекта, к которому привязан сенсор
      objname: "base_link_site"  # Имя объекта, к которому привязан сенсор
    - name: "base_link_site_global_angvel"  # Имя сенсора для глобальной угловой скорости
      type: "frameangvel"  # Тип сенсора
      objtype: "site"  # Тип объекта, к которому привязан сенсор
      objname: "base_link_site"  # Имя объекта, к которому привязан сенсор
  foot_sensors:
    - name_pattern: "{foot_prefix}_site_global_linvel"  # Шаблон имени сенсора для линейной скорости
      type: "framelinvel"  # Тип сенсора
      objtype: "site"  # Тип объекта, к которому привязан сенсор
      objname: "{foot_prefix}_site"  # Имя объекта, к которому привязан сенсор

# Пути к файлам и директориям теперь находятся в export_config.yml