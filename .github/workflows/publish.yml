name: Publish Docker image

# Гейт по образцу video-descriptor-rkllm: публикация :main только после
# успешно завершившегося Deploy на main (то есть тестовые сборки прошли).

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: publish (${{ matrix.image }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: desktop
            arch: amd64
            runner: ubuntu-latest
          - image: desktop
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: robot
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: web
            arch: amd64
            runner: ubuntu-latest
          - image: web
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        if: matrix.image == 'web'
        with:
          node-version: "22"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMG=ghcr.io/${OWNER}/rds-2p-software-${{ matrix.image }}" >> $GITHUB_ENV

      - name: Prepare build context
        run: |
          if [ "${{ matrix.image }}" = "robot" ]; then
            chmod +x docker/build_robot.sh && PREPARE_ONLY=1 ./docker/build_robot.sh
          elif [ "${{ matrix.image }}" = "web" ]; then
            chmod +x docker/build_web.sh && PREPARE_ONLY=1 ./docker/build_web.sh
          else
            chmod +x docker/build_desktop.sh && PREPARE_ONLY=1 ./docker/build_desktop.sh
          fi

      - name: Build and push desktop (${{ matrix.arch }})
        if: matrix.image == 'desktop'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/desktop.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMG }}:${{ matrix.arch }}-main
            ${{ env.IMG }}:${{ matrix.arch }}-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=desktop-${{ matrix.arch }}

      - name: Build and push robot (arm64)
        if: matrix.image == 'robot'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/robot.Dockerfile
          platforms: linux/arm64
          build-args: |
            NPU=0
          push: true
          provenance: false
          tags: |
            ${{ env.IMG }}:main
            ${{ env.IMG }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=robot-arm64

      - name: Build and push web (${{ matrix.arch }})
        if: matrix.image == 'web'
        uses: docker/build-push-action@v6
        with:
          context: build/web-context
          file: docker/web.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            WITH_MODELS=1
          push: true
          provenance: false
          tags: |
            ${{ env.IMG }}:${{ matrix.arch }}-main
            ${{ env.IMG }}:${{ matrix.arch }}-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}

  web-manifest:
    if: github.event.workflow_run.conclusion == 'success'
    needs: [publish]
    name: web main manifest (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch tags into multiarch tag
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io/${OWNER}/rds-2p-software-web"
          SHA="${{ github.event.workflow_run.head_sha }}"
          docker buildx imagetools create \
            -t "${IMG}:main" \
            -t "${IMG}:${SHA}" \
            "${IMG}:amd64-main" "${IMG}:arm64-main"

  desktop-manifest:
    if: github.event.workflow_run.conclusion == 'success'
    needs: [publish]
    name: desktop main manifest (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch tags into multiarch tag
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io/${OWNER}/rds-2p-software-desktop"
          SHA="${{ github.event.workflow_run.head_sha }}"
          docker buildx imagetools create \
            -t "${IMG}:main" \
            -t "${IMG}:${SHA}" \
            "${IMG}:amd64-main" "${IMG}:arm64-main"
